org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# AGP 8.x builds with JDK 17 and refuses newer. Do not pin an absolute path
# here — that only works on one machine. scripts/build-apk.sh exports
# JAVA_HOME=$ROOT/toolchain/jdk17, and scripts/bootstrap.sh installs it there.

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false
