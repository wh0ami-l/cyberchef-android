name: Release APK

# Builds a signed release APK and attaches it to a GitHub Release.
#
# The signing key is never in the repository. Provide it as repository secrets:
#
#   KEYSTORE_BASE64    base64 of the .jks    base64 -w0 android/keystore/cyberchef-release.jks
#   KEYSTORE_PASSWORD  the store password
#   KEY_PASSWORD       the key password (same value if you used the defaults)
#
# Triggered by pushing a tag like v11.5.0, or manually from the Actions tab.

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up JDK 17
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "17"

            # CyberChef is not vendored into this repository, so it is cloned
            # before Node is set up: the npm cache is keyed on
            # CyberChef/package-lock.json, and setup-node fails outright
            # ("Some specified paths were not resolved, unable to cache
            # dependencies") when that file does not exist yet.
            - name: Clone upstream CyberChef at the pinned revision
              run: |
                  . ./CYBERCHEF_VERSION
                  git clone "$REPOSITORY" CyberChef
                  git -C CyberChef checkout "$COMMIT"
                  echo "CyberChef $VERSION @ ${COMMIT:0:8}"

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: CyberChef/package-lock.json

            - name: Build the web bundle
              working-directory: CyberChef
              run: |
                  npm ci
                  npm run build

            # The ubuntu runner image already ships the Android SDK at
            # $ANDROID_HOME, including android-35 and build-tools 35.0.0, so no
            # third-party setup action is needed. Installing is idempotent and
            # only pins the exact versions this build targets.
            - name: Install Android SDK packages
              run: |
                  if [ -z "${ANDROID_HOME:-}" ]; then
                      echo "::error::ANDROID_HOME is not set on this runner"
                      exit 1
                  fi
                  echo "ANDROID_HOME=$ANDROID_HOME"
                  echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
                  SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
                  [ -x "$SDKMANAGER" ] || { echo "::error::sdkmanager not found"; exit 1; }
                  yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
                  "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

            # toolchain/ is gitignored (it holds a ~130 MB Gradle), so CI pulls
            # the same version instead of using the local copy.
            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v6
              with:
                  gradle-version: "8.10.2"

            - name: Decode the signing keystore
              env:
                  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
              run: |
                  if [ -z "$KEYSTORE_BASE64" ]; then
                      echo "::error::KEYSTORE_BASE64 is not set — configure the secrets (see docs/发布指南.md) before tagging"
                      exit 1
                  fi
                  mkdir -p android/keystore
                  printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/cyberchef-release.jks

            - name: Package web assets and build the APK
              env:
                  KEYSTORE_FILE: keystore/cyberchef-release.jks
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: cyberchef
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: |
                  node scripts/package-web.mjs
                  gradle -p android assembleRelease --console=plain

            - name: Verify the signature
              run: |
                  APK=android/app/build/outputs/apk/release/app-release.apk
                  [ -f "$APK" ] || { echo "::error::no APK was produced"; exit 1; }
                  APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
                  "$APKSIGNER" verify --print-certs "$APK"

            - name: Name the artifact after the tag
              id: apk
              run: |
                  APK=android/app/build/outputs/apk/release/app-release.apk
                  NAME="CyberChef-app-release${GITHUB_REF_NAME:+-$GITHUB_REF_NAME}.apk"
                  cp "$APK" "$NAME"
                  echo "name=$NAME" >> "$GITHUB_OUTPUT"
                  sha256sum "$NAME" | tee "$NAME.sha256"
                  ls -lh "$NAME"

            - uses: actions/upload-artifact@v7
              with:
                  name: apk
                  path: |
                      CyberChef-app-release*.apk
                      CyberChef-app-release*.apk.sha256

            - name: Attach to the release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      CyberChef-app-release*.apk
                      CyberChef-app-release*.apk.sha256
                  body: |
                      Unofficial Android port of CyberChef ${{ github.ref_name }}.

                      Not produced, endorsed or approved by GCHQ or the CyberChef
                      maintainers. CyberChef is licensed under the Apache License 2.0;
                      see NOTICE and LICENSE in the repository.

                      Verify the download against the attached `.sha256` file before
                      installing.
